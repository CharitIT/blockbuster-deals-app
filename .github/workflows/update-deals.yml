name: Update deals

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch deals from blockbusterdeals.net
        run: python scripts/fetch_deals.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- deals.json; then echo "No changes"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "Update deals $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
